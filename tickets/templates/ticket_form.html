<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Ticket</title>
</head>

<body>

    {% if ticket %}
        <h1>Edit Ticket</h1>
    {% else %}
        <h1>Create Ticket</h1>
    {% endif %}

    <form method="POST">

        {% csrf_token %}

        {{ form.as_p }}

        <button type="submit">
            Save
        </button>

    </form>

    <a href="{% url 'ticket_list' %}">
        Cancel
    </a>

</body>
</html>
