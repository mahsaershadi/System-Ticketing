<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Delete Ticket</title>
</head>

<body>

    <h1>Delete Ticket</h1>

    <p>
        Are you sure you want to delete
        "{{ ticket.title }}"?
    </p>

    <form method="POST">

        {% csrf_token %}

        <button type="submit">
            Yes, delete
        </button>

        <a href="{% url 'ticket_detail' ticket.pk %}">
            Cancel
        </a>

    </form>

</body>
</html>
