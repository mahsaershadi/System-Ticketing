{% extends "base.html" %}

{% block title %}Login · Tickify{% endblock %}


{% block content %}

<div class="auth-container">

    <div class="auth-header">

        <div class="auth-logo">
            ◈
        </div>

        <h1>
            Welcome back
        </h1>

        <p>
            Sign in to manage your tickets.
        </p>

    </div>


    <div class="form-card">

        <form method="POST">

            {% csrf_token %}

            {{ form.as_p }}

            <button
                type="submit"
                class="full-button"
            >
                Login
            </button>

        </form>

    </div>


    <p class="auth-footer">
        Don't have an account?
        <a href="{% url 'register' %}">
            Create one
        </a>
    </p>

</div>

{% endblock %}
