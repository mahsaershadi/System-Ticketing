{% extends "base.html" %}

{% block title %}Create Account · Tickify{% endblock %}


{% block content %}

<div class="auth-container">

    <div class="auth-header">

        <div class="auth-logo">
            ◈
        </div>

        <h1>
            Create your account
        </h1>

        <p>
            Start managing your organization's tickets.
        </p>

    </div>


    <div class="form-card">

        <form method="POST">

            {% csrf_token %}

            {{ form.as_p }}

            <button
                type="submit"
                class="full-button"
            >
                Create Account
            </button>

        </form>

    </div>


    <p class="auth-footer">
        Already have an account?
        <a href="{% url 'login' %}">
            Sign in
        </a>
    </p>

</div>

{% endblock %}
